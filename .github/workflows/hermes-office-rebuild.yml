name: Hermes Office Build & Publish

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/hermes-office-rebuild.yml"
      - "README.md"
      - "docker/**"
      - "deploy/**"
      - "skills/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from Dockerfile
        run: |
          VERSION=$(grep -oP '^ARG HERMES_AGENT_VERSION=\K.*' Dockerfile)
          echo "BASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "📦 Hermes-agent version: $VERSION"

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/hermes-office:latest
            ghcr.io/${{ env.OWNER }}/hermes-office:${{ env.BASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Final summary
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "🎉 Tags pushed:"
            echo "  ghcr.io/${{ env.OWNER }}/hermes-office:latest"
            echo "  ghcr.io/${{ env.OWNER }}/hermes-office:${{ env.BASE_VERSION }}"
          else
            echo "❌ Build & Push failed or was skipped."
          fi
